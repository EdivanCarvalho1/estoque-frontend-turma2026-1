openapi: 3.0.3
info:
  title: Estoque API
  description: API de controle de estoque
  version: 1.0.0
servers:
  - url: http://localhost:3000
    description: Servidor local
paths:
  /products:
    post:
      operationId: CreateProduct
      summary: Cria um produto
      tags:
        - Products
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'
            example:
              barcode: '123456'
              name: Coca Cola 350ml
      responses:
        '201':
          description: Produto criado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
              example:
                barcode: '123456'
                name: Coca Cola 350ml
                quantityInStock: 0
        '400':
          description: Corpo da requisicao invalido ou produto ja existente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidRequest:
                  value:
                    error: Invalid request body
                duplicateProduct:
                  value:
                    error: Product with the same barcode already exists
        '500':
          description: Erro de infraestrutura
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Database error
    get:
      operationId: GetAllProducts
      summary: Lista todos os produtos
      tags:
        - Products
      responses:
        '200':
          description: Lista de produtos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
              example:
                - barcode: '123456'
                  name: Coca Cola 350ml
                  quantityInStock: 0
                - barcode: '789012'
                  name: Pepsi 350ml
                  quantityInStock: 0
        '500':
          description: Erro de infraestrutura
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Database error
components:
  schemas:
    CreateProductRequest:
      type: object
      required:
        - barcode
        - name
      properties:
        barcode:
          type: string
          minLength: 1
          description: Codigo de barras do produto
        name:
          type: string
          minLength: 1
          description: Nome do produto
    Product:
      type: object
      required:
        - barcode
        - name
        - quantityInStock
      properties:
        barcode:
          type: string
          description: Codigo de barras do produto
        name:
          type: string
          description: Nome do produto
        quantityInStock:
          type: integer
          minimum: 0
          description: Quantidade disponivel em estoque
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string